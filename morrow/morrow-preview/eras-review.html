(()=>{
// Pure preview-domain helpers. They never read or write browser storage.
function parseAmount(input) {
  const text = String(input).trim();
  if (!/^\d+(\.\d{1,2})?$/.test(text)) throw new Error('invalidAmount');
  const [whole, fraction = ''] = text.split('.');
  const amount = BigInt(whole) * 100n + BigInt(fraction.padEnd(2, '0'));
  if (amount <= 0n || amount > BigInt(Number.MAX_SAFE_INTEGER)) throw new Error('invalidAmount');
  return Number(amount);
}

function isCalendarDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value) || value < '1900-01-01' || value > '9999-12-31') return false;
  const date = new Date(value + 'T12:00:00Z');
  return !Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === value;
}

function monthWindow(month) {
  const [year, number] = month.split('-').map(Number);
  return Array.from({length: 6}, (_, index) => {
    const date = new Date(Date.UTC(year, number - 6 + index, 15));
    return date.toISOString().slice(0, 7);
  });
}

function add(a, b) {
  const value = a + b;
  if (!Number.isSafeInteger(value) || value < 0) throw new Error('totalOverflow');
  return value;
}

function summarize(base, records, month) {
  const initial = base[month] ?? {income: 0, expense: 0, categories: {}};
  const result = {
    income: initial.income,
    expense: initial.expense,
    categories: new Map(Object.entries(initial.categories))
  };
  for (const record of records) {
    if (record.date.slice(0, 7) !== month) continue;
    result[record.type] = add(result[record.type], record.amount);
    if (record.type === 'expense') {
      result.categories.set(record.category, add(result.categories.get(record.category) ?? 0, record.amount));
    }
  }
  return result;
}

function upsertRecord(records, next) {
  if (!isCalendarDate(next.date)) throw new Error('invalidDate');
  if (!['income', 'expense'].includes(next.type)) throw new Error('invalidType');
  if (!Number.isSafeInteger(next.amount) || next.amount <= 0) throw new Error('invalidAmount');
  const position = records.findIndex(record => record.id === next.id);
  return position === -1
    ? [next, ...records]
    : records.map((record, index) => index === position ? next : record);
}

const ERA_THEMES = [
  {id:'eternal-bloom',name:'Eternal Bloom',descriptionKey:'eternalDescription',palette:['#e9e3ed','#b9a8c8','#be98a7','#f4eef2'],flower:'pearl'},
  {id:'pink-pony',name:'Pink Pony Garden',descriptionKey:'ponyDescription',palette:['#eee1e6','#a7647e','#764455','#d6a7b6'],flower:'star'},

];
const GARDEN_STAGES = ['seed','sprout','growing','blooming','fullBloom'];
const GARDEN_CURRENCIES = ['CNY','USD','EUR','GBP'];
const gardenMinor = value => Number.isSafeInteger(value) && value >= 0;

function goalProgress(saved,target) {
  if(!Number.isSafeInteger(saved)||!Number.isSafeInteger(target)||target<=0) return {valid:false,percent:0,stage:0,complete:false};
  const current=BigInt(Math.max(0,saved)), total=BigInt(target);
  const basisPoints=current>=total?10000n:current*10000n/total;
  const percent=Number(basisPoints)/100;
  const stage=current>=total?4:current*4n>=total*3n?3:current*2n>=total?2:current*4n>=total?1:0;
  return {valid:true,percent,stage,complete:current>=total};
}

function emptyGardenState() {
  return {schemaVersion:2,goals:[],operations:[],receipts:[],achievements:[],reviews:[],wrappedSnapshots:[],settings:{motion:'system',milestoneCurrency:'CNY',milestoneThresholds:[10000,50000,100000]}};
}

function validateGardenGoal(goal) {
  if(!goal||typeof goal.id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(goal.id)||typeof goal.name!=='string'||!goal.name.trim()||goal.name.length>80) throw new Error('gardenInvalidName');
  if(!gardenMinor(goal.targetAmount)||goal.targetAmount===0||!gardenMinor(goal.currentSaved)) throw new Error('gardenInvalidAmount');
  if(!GARDEN_CURRENCIES.includes(goal.currency)) throw new Error('gardenInvalidCurrency');
  if(!ERA_THEMES.some(theme=>theme.id===goal.themeId)) throw new Error('gardenInvalidTheme');
  if(goal.targetDate!==null&&!isCalendarDate(goal.targetDate)) throw new Error('invalidDate');
  if(typeof goal.paused!=='boolean'||!['manual','legacy-total'].includes(goal.fundingMode)) throw new Error('gardenInvalidBackup');
  if(!Number.isSafeInteger(goal.revision)||goal.revision<1)throw new Error('gardenInvalidBackup');
  for(const key of ['createdAt','updatedAt']) if(typeof goal[key]!=='string'||!Number.isFinite(Date.parse(goal[key]))) throw new Error('gardenInvalidBackup');
  if(goal.bloomedAt!==null&&(typeof goal.bloomedAt!=='string'||!Number.isFinite(Date.parse(goal.bloomedAt)))) throw new Error('gardenInvalidBackup');
  if(goal.bloomedAt!==null&&!ERA_THEMES.some(theme=>theme.id===goal.bloomedThemeId))throw new Error('gardenInvalidBackup');
  return goal;
}

function validateGardenState(state) {
  if(!state||![1,2].includes(state.schemaVersion)||!Array.isArray(state.goals)||!Array.isArray(state.operations)||!Array.isArray(state.receipts)) throw new Error('gardenInvalidBackup');
  const normalized={...state,schemaVersion:2,achievements:state.achievements??[],reviews:state.reviews??[],wrappedSnapshots:state.wrappedSnapshots??[],settings:{milestoneCurrency:'CNY',milestoneThresholds:[10000,50000,100000],...state.settings}};
  if(!Array.isArray(normalized.achievements)||!Array.isArray(normalized.reviews)||!Array.isArray(normalized.wrappedSnapshots))throw new Error('gardenInvalidBackup');
  const ids=new Set();
  for(const goal of state.goals){validateGardenGoal(goal);if(ids.has(goal.id))throw new Error('gardenInvalidBackup');ids.add(goal.id);}
  const operations=new Set();
  for(const operation of state.operations){
    if(!operation||typeof operation.id!=='string'||operations.has(operation.id)||typeof operation.kind!=='string'||typeof operation.at!=='string'||!Number.isFinite(Date.parse(operation.at)))throw new Error('gardenInvalidBackup');
    operations.add(operation.id);
  }
  for(const receipt of state.receipts){if(!receipt||typeof receipt.digest!=='string'||typeof receipt.raw!=='string'||typeof receipt.at!=='string')throw new Error('gardenInvalidBackup');legacyGardenPreview(receipt.raw);}
  if(!state.settings||!['system','reduce'].includes(state.settings.motion)) throw new Error('gardenInvalidBackup');
  const achievementCodes=new Set();
  for(const achievement of normalized.achievements){if(!achievement||!ACHIEVEMENT_DEFINITIONS.some(definition=>definition.code===achievement.code)||achievementCodes.has(achievement.code)||!Number.isFinite(Date.parse(achievement.unlockedAt))||!ERA_THEMES.some(theme=>theme.id===achievement.themeId))throw new Error('gardenInvalidBackup');achievementCodes.add(achievement.code);}
  for(const review of normalized.reviews)if(!review||!['monthly','budget'].includes(review.kind)||typeof review.period!=='string'||!Number.isFinite(Date.parse(review.at)))throw new Error('gardenInvalidBackup');
  const snapshotIds=new Set();
  for(const snapshot of normalized.wrappedSnapshots){
    if(!snapshot||typeof snapshot.id!=='string'||snapshotIds.has(snapshot.id)||!Number.isFinite(Date.parse(snapshot.generatedAt))||!snapshot.summary||!Number.isInteger(snapshot.year)||snapshot.year<1900||snapshot.year>9999||snapshot.summary.year!==snapshot.year||!GARDEN_CURRENCIES.includes(snapshot.summary.currency)||!snapshot.summary.hasAnyData)throw new Error('gardenInvalidBackup');
    snapshotIds.add(snapshot.id);
  }
  const thresholds=normalized.settings.milestoneThresholds;
  if(!GARDEN_CURRENCIES.includes(normalized.settings.milestoneCurrency)||!Array.isArray(thresholds)||thresholds.length!==3||thresholds.some((value,index)=>!gardenMinor(value)||value===0||(index>0&&value<=thresholds[index-1])))throw new Error('gardenInvalidBackup');
  return normalized;
}

function saveGardenGoal(state,candidate,operationId,at,expectedRevision) {
  if(state.operations.some(operation=>operation.id===operationId))return state;
  validateGardenGoal(candidate);
  const prior=state.goals.find(goal=>goal.id===candidate.id);
  if(expectedRevision!==undefined&&(prior?.revision??0)!==expectedRevision)throw new Error('gardenConflict');
  if(prior&&prior.currency!==candidate.currency&&prior.currentSaved>0)throw new Error('gardenCurrencyLocked');
  if(prior?.fundingMode==='legacy-total'&&candidate.currentSaved!==prior.currentSaved)throw new Error('gardenLegacyLocked');
  const goal={...candidate,createdAt:prior?.createdAt??candidate.createdAt,updatedAt:at,
    revision:(prior?.revision??0)+1,
    bloomedAt:prior?.bloomedAt??(goalProgress(candidate.currentSaved,candidate.targetAmount).complete?at:null),
    bloomedThemeId:prior?.bloomedThemeId??(goalProgress(candidate.currentSaved,candidate.targetAmount).complete?candidate.themeId:null)};
  return {...state,goals:prior?state.goals.map(item=>item.id===goal.id?goal:item):[...state.goals,goal],
    operations:[...state.operations,{id:operationId,kind:prior?'goal.update':'goal.create',at,goalId:goal.id,
      before:prior?.currentSaved??0,after:goal.currentSaved,currency:goal.currency,fundingMode:goal.fundingMode,themeId:goal.themeId,targetBefore:prior?.targetAmount??null,targetAfter:goal.targetAmount}]};
}

function transferGardenFunds(state,fromId,toId,amount,operationId,at) {
  if(state.operations.some(operation=>operation.id===operationId))return state;
  const from=state.goals.find(goal=>goal.id===fromId),to=state.goals.find(goal=>goal.id===toId);
  if(!from||!to||fromId===toId||from.currency!==to.currency)throw new Error('gardenInvalidTransfer');
  if(from.paused||to.paused)throw new Error('gardenPausedTransfer');
  if(from.fundingMode!=='manual'||to.fundingMode!=='manual')throw new Error('gardenLegacyLocked');
  if(!gardenMinor(amount)||amount===0||amount>from.currentSaved||!Number.isSafeInteger(to.currentSaved+amount))throw new Error('gardenInvalidTransfer');
  const goals=state.goals.map(goal=>goal.id===fromId?{...goal,currentSaved:goal.currentSaved-amount,updatedAt:at,revision:goal.revision+1}:
    goal.id===toId?{...goal,currentSaved:goal.currentSaved+amount,updatedAt:at,revision:goal.revision+1,
      bloomedAt:goal.bloomedAt??(goalProgress(goal.currentSaved+amount,goal.targetAmount).complete?at:null),
      bloomedThemeId:goal.bloomedThemeId??(goalProgress(goal.currentSaved+amount,goal.targetAmount).complete?goal.themeId:null)}:goal);
  return {...state,goals,operations:[...state.operations,{id:operationId,kind:'goal.transfer',at,fromId,toId,amount,currency:from.currency}]};
}

function legacyGardenPreview(raw) {
  let legacy;
  try{legacy=JSON.parse(raw);}catch{throw new Error('gardenInvalidLegacy');}
  if(!legacy||!Array.isArray(legacy.accounts)||!Array.isArray(legacy.transactions)||!legacy.goal)throw new Error('gardenInvalidLegacy');
  let total=0;
  for(const account of legacy.accounts){
    if(!account||!gardenMinor(account.amount)||typeof account.id!=='string'||typeof account.name!=='string'||!isCalendarDate(account.updated))throw new Error('gardenInvalidLegacy');
    total+=account.amount;if(!Number.isSafeInteger(total))throw new Error('gardenInvalidLegacy');
  }
  for(const transaction of legacy.transactions){
    if(!transaction||!gardenMinor(transaction.amount)||!isCalendarDate(transaction.date)||!['income','expense'].includes(transaction.type)||
       ['id','category','account','note'].some(key=>typeof transaction[key]!=='string'))throw new Error('gardenInvalidLegacy');
  }
  if(typeof legacy.goal.name!=='string'||!legacy.goal.name.trim()||!gardenMinor(legacy.goal.amount)||legacy.goal.amount===0)throw new Error('gardenInvalidLegacy');
  return {name:legacy.goal.name,targetAmount:legacy.goal.amount,currentSaved:total,accountCount:legacy.accounts.length,transactionCount:legacy.transactions.length};
}

function applyLegacyGarden(state,raw,digest,operationId,at,goalId) {
  if(state.receipts.some(receipt=>receipt.digest===digest))return state;
  const source=legacyGardenPreview(raw),prior=state.goals.find(goal=>goal.fundingMode==='legacy-total');
  if(prior)throw new Error('gardenLegacyAlreadyImported');
  const goal={id:goalId,name:source.name,targetAmount:source.targetAmount,currentSaved:source.currentSaved,
    themeId:'eternal-bloom',currency:'CNY',targetDate:null,paused:false,fundingMode:'legacy-total',
    createdAt:at,updatedAt:at,revision:1,bloomedAt:goalProgress(source.currentSaved,source.targetAmount).complete?at:null,
    bloomedThemeId:goalProgress(source.currentSaved,source.targetAmount).complete?'eternal-bloom':null};
  validateGardenGoal(goal);
  return {...state,goals:[...state.goals,goal],operations:[...state.operations,{id:operationId,kind:'legacy.import',goalId,at}],
    receipts:[...state.receipts,{digest,raw,at,goalId}]};
}

const artEscape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function gardenFlower(x,y,size,theme,openness=1) {
  const petals=theme.flower==='daisy'?10:theme.flower==='star'?6:7;
  const shape=Array.from({length:petals},(_,i)=>{
    const angle=360/petals*i;
    return theme.flower==='star'
      ? `<path d="M0 3 Q${-size*.65} ${-size*.4} 0 ${-size*openness} Q${size*.65} ${-size*.4} 0 3" transform="rotate(${angle})"/>`
      : `<ellipse cy="${-size*.44*openness}" rx="${size*.32}" ry="${size*.59*openness}" transform="rotate(${angle})"/>`;
  }).join('');
  return `<g class="garden-flower" transform="translate(${x} ${y})"><g fill="${theme.palette[3]}" stroke="${theme.palette[2]}" stroke-opacity=".36" stroke-width=".8">${shape}</g><circle r="${size*.19}" fill="${theme.flower==='daisy'?'#c8b689':theme.palette[1]}"/><circle r="${size*.09}" fill="#f4ece3" fill-opacity=".8"/></g>`;
}

function renderGardenSvg(themeId,stage,{prefix='garden',label='Original savings garden'}={}) {
  const theme=ERA_THEMES.find(item=>item.id===themeId)??ERA_THEMES[0];
  const phase=Math.max(0,Math.min(4,Math.trunc(Number(stage)||0)));
  const id='garden-'+String(prefix).replace(/[^a-zA-Z0-9_-]/g,'');
  const [background,accent,shadow,petal]=theme.palette;
  let atmosphere='';
  if(theme.id==='eternal-bloom')atmosphere=`<ellipse cx="450" cy="84" rx="92" ry="29" fill="#fff" opacity=".23"/><ellipse cx="120" cy="120" rx="68" ry="24" fill="#fff" opacity=".22"/><circle cx="440" cy="65" r="26" fill="url(#${id}-pearl)"/>${[[108,62,3],[480,155,2],[154,203,2],[377,41,2]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity=".7"/>`).join('')}`;
  if(theme.id==='pink-pony')atmosphere=`<path d="m135 0 90 270H10ZM455 0 140 270h290Z" fill="#be8c9f" opacity=".13"/><path d="M0 38q300 100 600 0" fill="none" stroke="${shadow}" stroke-opacity=".13"/>${[[100,100],[478,78],[427,160]].map(([x,y])=>`<path d="M${x-7} ${y}h14m-7-7v14" stroke="${shadow}" stroke-opacity=".48" stroke-width="1"/>`).join('')}`;
  if(theme.id==='charm')atmosphere=`<circle cx="448" cy="83" r="33" fill="#f6efd9" opacity=".82"/><path d="m0 0 220 0L80 245H0Z" fill="#fff" opacity=".16"/><path d="M42 250q30-19 57-4m390 2q20-12 43-2" fill="none" stroke="${accent}" stroke-opacity=".35"/><ellipse cx="139" cy="283" rx="20" ry="7" fill="#bab9a7" opacity=".45"/>`;
  if(theme.id==='blue-hour')atmosphere=`<path d="M0 163q135-38 280 0t320 0V0H0Z" fill="${accent}" opacity=".12"/><path d="M0 176q135-38 280 0t320 0" fill="none" stroke="${shadow}" stroke-opacity=".25"/><circle cx="462" cy="66" r="22" fill="#f1e9d9" opacity=".8"/><ellipse cx="462" cy="202" rx="48" ry="3" fill="#eae4d9" opacity=".45"/>`;
  const rootY=283;
  let plants='';
  if(phase===0){
    plants=`<path d="M281 278q12-22 30-6-2 22-30 6Z" fill="${accent}" stroke="${shadow}" stroke-width="1.2"/><path d="m286 280 16-9" stroke="${petal}" stroke-opacity=".7"/>`;
  } else {
    const stems=phase===1?[[300,211,0]]:phase===2?[[300,156,1],[251,211,0],[350,204,0]]:
      phase===3?[[300,117,2],[230,161,1],[373,171,1],[181,222,0]]:
      [[300,106,3],[225,149,3],[378,151,3],[167,205,2],[435,212,2]];
    plants=stems.map(([x,y,bloom],index)=>{
      const bend=x<300?x+25:x-22;
      const leafY=y+(rootY-y)*.55;
      const stem=`<path class="garden-stem" d="M300 ${rootY}Q${bend} ${leafY} ${x} ${y}" fill="none" stroke="${theme.id==='charm'?'#7e8e72':shadow}" stroke-width="${index===0?2:1.7}" stroke-linecap="round"/>`;
      const leaves=`<path d="M${bend} ${leafY+10}q-35-4-38-28 31-5 38 28Z" fill="${accent}" fill-opacity=".75"/><path d="M${bend+1} ${leafY-1}q33-6 33-28-30 1-33 28Z" fill="${accent}" fill-opacity=".48"/>`;
      const flower=bloom>0?gardenFlower(x,y,phase===4?(index<3?30:21):phase===3?24:13,theme,bloom===1?.54:1):`<ellipse cx="${x}" cy="${y}" rx="6" ry="10" fill="${accent}"/>`;
      return stem+leaves+flower;
    }).join('');
  }
  return `<svg class="garden-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="${id}-title"><title id="${id}-title">${artEscape(label)}</title><defs><linearGradient id="${id}-sky" x2="0" y2="1"><stop stop-color="${background}"/><stop offset="1" stop-color="${petal}"/></linearGradient><radialGradient id="${id}-pearl"><stop stop-color="#fff"/><stop offset=".6" stop-color="#efe8ed"/><stop offset="1" stop-color="${accent}" stop-opacity=".4"/></radialGradient><filter id="${id}-grain"><feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="600" height="360" rx="20" fill="url(#${id}-sky)"/>${atmosphere}<ellipse cx="300" cy="302" rx="186" ry="30" fill="${shadow}" opacity=".08"/><ellipse cx="300" cy="293" rx="160" ry="23" fill="${petal}"/><ellipse cx="300" cy="290" rx="146" ry="19" fill="${accent}" fill-opacity=".10" stroke="${shadow}" stroke-opacity=".18"/>${plants}<path d="M275 292q26 5 51-1" fill="none" stroke="${shadow}" stroke-opacity=".25" stroke-linecap="round"/><rect width="600" height="360" rx="20" filter="url(#${id}-grain)" opacity=".035" pointer-events="none"/></svg>`;
}

function actualLedger(state) {
  const receipt=state.receipts.find(item=>item.raw);
  if(!receipt)return {available:false,transactions:[]};
  try{return {available:true,transactions:JSON.parse(receipt.raw).transactions.map(item=>({...item,currency:'CNY'}))};}
  catch{return {available:false,transactions:[]};}
}

function safeSum(values){const amount=values.reduce((sum,value)=>sum+BigInt(value),0n);if(amount>BigInt(Number.MAX_SAFE_INTEGER)||amount<BigInt(Number.MIN_SAFE_INTEGER))throw new Error('totalOverflow');return Number(amount);}
function activeDayWindows(records){
  const days=[...new Set(records.map(record=>record.date))].sort();
  const numbers=days.map(day=>Math.floor(Date.parse(day+'T12:00:00Z')/86400000));
  let consecutive=0,bestConsecutive=0,bestThirty=0,left=0;
  numbers.forEach((day,index)=>{consecutive=index&&day===numbers[index-1]+1?consecutive+1:1;bestConsecutive=Math.max(bestConsecutive,consecutive);while(day-numbers[left]>29)left++;bestThirty=Math.max(bestThirty,index-left+1);});
  return {days:days.length,bestConsecutive,bestThirty};
}

function monthlyActualSummary(state,month,at) {
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))return {recordCount:0,income:null,spending:null};
  const records=actualLedger(state).transactions.filter(record=>record.date.startsWith(month)&&record.date<=at.slice(0,10));
  return {recordCount:records.length,income:safeSum(records.filter(record=>record.type==='income').map(record=>record.amount)),spending:safeSum(records.filter(record=>record.type==='expense').map(record=>record.amount))};
}

function achievementConditions(state,at) {
  const today=at.slice(0,10),records=actualLedger(state).transactions.filter(record=>record.date<=today);
  const windows=activeDayWindows(records),currency=state.settings.milestoneCurrency??'CNY';
  const thresholds=state.settings.milestoneThresholds??[10000,50000,100000];
  // Use a single goal's current allocation, never sum potentially overlapping
  // imported total-savings snapshots and individually allocated goals.
  const largest=Math.max(0,...state.goals.filter(goal=>goal.currency===currency).map(goal=>goal.currentSaved));
  const currentComplete=state.goals.filter(goal=>goal.currentSaved>=goal.targetAmount).length;
  const themes=new Set([...state.goals.map(goal=>goal.themeId),...state.operations.filter(operation=>operation.themeId).map(operation=>operation.themeId)]);
  return {
    'save-1':{current:largest,target:thresholds[0],currency},'save-2':{current:largest,target:thresholds[1],currency},'save-3':{current:largest,target:thresholds[2],currency},
    'goal-1':{current:currentComplete,target:1},'goal-3':{current:currentComplete,target:3},
    'transaction-1':{current:records.length,target:1},'week-1':{current:windows.bestConsecutive,target:7},
    'review-1':{current:state.reviews.filter(review=>review.kind==='monthly').length,target:1},'tracker':{current:windows.bestThirty,target:20},
    'budget-1':{current:(state.budgets??[]).length,target:1,upstream:true},
    'budget-review':{current:state.reviews.filter(review=>review.kind==='budget').length,target:1,upstream:true},
    'wishlist':{current:(state.wishlist??[]).filter(item=>item.reviewedAt&&item.reviewedAt>=item.cooldownUntil).length,target:1,upstream:true},
    'allocation':{current:state.operations.filter(operation=>['goal.create','goal.update'].includes(operation.kind)&&operation.after>operation.before&&operation.fundingMode!=='legacy-total').length,target:1},
    'era-1':{current:state.goals.length,target:1},'bloom-1':{current:currentComplete,target:1},'eras-4':{current:themes.size,target:4},
    'wrapped-1':{current:state.wrappedSnapshots.length,target:1}
  };
}

function reconcileAchievements(state,at) {
  const existing=new Set(state.achievements.map(item=>item.code));const conditions=achievementConditions(state,at);
  const theme=state.goals.at(-1)?.themeId??'eternal-bloom';
  const additions=ACHIEVEMENT_DEFINITIONS.filter(definition=>!existing.has(definition.code)&&conditions[definition.code].current>=conditions[definition.code].target)
    .map(definition=>({id:definition.code,code:definition.code,unlockedAt:at,themeId:theme,
      metadata:{version:definition.version,conditionAtUnlock:conditions[definition.code],observedFromImport:state.receipts.length>0}}));
  return additions.length?{...state,achievements:[...state.achievements,...additions]}:state;
}

function annualGardenSummary(state,year,currency,at) {
  if(!Number.isInteger(year)||year<1900||year>9999)throw new Error('invalidDate');
  const source=actualLedger(state),records=source.transactions.filter(record=>record.currency===currency&&record.date.startsWith(year+'-')&&record.date<=at.slice(0,10));
  const hasLedger=source.available&&currency==='CNY';
  const income=hasLedger?safeSum(records.filter(record=>record.type==='income').map(record=>record.amount)):null;
  const spending=hasLedger?safeSum(records.filter(record=>record.type==='expense').map(record=>record.amount)):null;
  const expenses=records.filter(record=>record.type==='expense');const categoryAmounts=new Map(),categoryCounts=new Map();
  for(const record of expenses){categoryAmounts.set(record.category,safeSum([categoryAmounts.get(record.category)??0,record.amount]));categoryCounts.set(record.category,(categoryCounts.get(record.category)??0)+1);}
  const operations=state.operations.filter(operation=>operation.at.startsWith(year+'-')&&operation.currency===currency);
  // Initial balances/imported snapshots have no known original savings date.
  // Only subsequent, explicitly recorded allocation adjustments enter this sum.
  const adjustments=operations.filter(operation=>operation.kind==='goal.update'&&operation.fundingMode!=='legacy-total');
  const allocated=adjustments.length?safeSum(adjustments.map(operation=>operation.after-operation.before)):null;
  const completed=state.goals.filter(goal=>goal.currency===currency&&goal.fundingMode!=='legacy-total'&&goal.bloomedAt?.startsWith(year+'-'));
  const largest=completed.sort((a,b)=>a.bloomedAt.localeCompare(b.bloomedAt))[0];
  return {schemaVersion:1,year,currency,hasLedger,recordCount:records.length,income,spending,
    netCashFlow:hasLedger?income-spending:null,savingsRate:income>0?(income-spending)/income*100:null,
    recordedAllocations:allocated,activeDays:new Set(records.map(record=>record.date)).size,
    frequentCategory:[...categoryCounts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0]?.[0]??null,
    topCategories:[...categoryAmounts].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([name,amount])=>({name,amount})),
    goalsCompleted:completed.length,favoriteMilestone:largest?{kind:'goal.bloom',at:largest.bloomedAt,themeId:largest.bloomedThemeId}:null,
    hasAnyData:records.length>0||adjustments.length>0||completed.length>0};
}

function cloudCanonical(value) {
  if(Array.isArray(value))return '['+value.map(cloudCanonical).join(',')+']';
  if(value&&typeof value==='object')return '{'+Object.keys(value).sort().map(key=>JSON.stringify(key)+':'+cloudCanonical(value[key])).join(',')+'}';
  return JSON.stringify(value);
}
const cloudStateEqual=(a,b)=>cloudCanonical(a)===cloudCanonical(b);
function cloudMetadata(value) {
  return {enabled:false,generation:0,dirty:false,remoteVersion:0,pending:null,lastSynced:null,...value};
}
function cloudPrepare(state,metadata,id) {
  const meta=cloudMetadata(metadata);
  return meta.pending?meta:{...meta,pending:{id,payload:state,generation:meta.generation,expectedVersion:meta.remoteVersion}};
}
function cloudAcknowledge(state,metadata,result,requestId) {
  const meta=cloudMetadata(metadata),pending=meta.pending;
  // Another tab may have acknowledged this request or prepared a newer one.
  if(!pending||pending.id!==requestId)return meta;
  if(!Number.isSafeInteger(result.version)||result.version<=pending.expectedVersion)throw new Error('cloudInvalidResponse');
  return {...meta,remoteVersion:result.version,pending:null,
    dirty:meta.generation!==pending.generation||!cloudStateEqual(state,pending.payload),lastSynced:new Date().toISOString()};
}


function createGardenStore({name='morrow-garden-v1'}={}) {
  let database;
  const listeners=new Set();
  const changes=typeof BroadcastChannel==='function'?new BroadcastChannel(name+'-updates'):null;
  const emit=()=>listeners.forEach(callback=>callback());
  if(changes)changes.onmessage=emit;
  async function open() {
    if(database)return database;
    database=await new Promise((resolve,reject)=>{
      const request=indexedDB.open(name,1);
      request.onupgradeneeded=()=>{request.result.createObjectStore('state');request.result.createObjectStore('recovery',{autoIncrement:true});};
      request.onsuccess=()=>{const result=request.result;result.onversionchange=()=>{result.close();database=null;};resolve(result);};
      request.onerror=request.onblocked=()=>reject(new Error('gardenStorageUnavailable'));
    });return database;
  }
  async function readCloud() {
    const db=await open();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction('state','readonly'),table=tx.objectStore('state');let state,meta,error;
      table.get('current').onsuccess=event=>{try{state=validateGardenState(event.target.result??emptyGardenState());}catch(e){error=e;}};
      table.get('cloud').onsuccess=event=>meta=cloudMetadata(event.target.result);
      tx.oncomplete=()=>error?reject(error):resolve({state,meta});
      tx.onerror=tx.onabort=()=>reject(new Error('gardenStorageUnavailable'));
    });
  }
  async function atomic(reducer,{recovery=false}={}) {
    const db=await open();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(['state','recovery'],'readwrite'),table=tx.objectStore('state');let result,error,changed=false;
      table.get('current').onsuccess=event=>{
        const raw=event.target.result;
        table.get('cloud').onsuccess=metadataEvent=>{
          try {
            const current=validateGardenState(raw??emptyGardenState()),metadata=cloudMetadata(metadataEvent.target.result);
            const next=reducer(current,metadata);next.state=validateGardenState(next.state);
            if(recovery||raw?.schemaVersion===1)tx.objectStore('recovery').add({createdAt:new Date().toISOString(),state:raw??current});
            changed=!cloudStateEqual(raw??emptyGardenState(),next.state);
            if(changed)table.put(next.state,'current');
            if(!cloudStateEqual(metadata,next.meta))table.put(next.meta,'cloud');
            result=next.result??next.state;
          }catch(problem){error=problem;tx.abort();}
        };
      };
      tx.oncomplete=()=>{if(changed){changes?.postMessage('changed');emit();}resolve(result);};
      tx.onerror=tx.onabort=()=>reject(error??new Error('gardenStorageUnavailable'));
    });
  }
  return {
    read:async()=>(await readCloud()).state,
    readCloud,
    update(reducer,options){return atomic((current,meta)=>{
      const state=validateGardenState(reconcileAchievements(validateGardenState(reducer(current)),new Date().toISOString()));
      return {state,meta:cloudStateEqual(current,state)?meta:{...meta,generation:meta.generation+1,dirty:true}};
    },options);},
    setCloudEnabled(enabled){return atomic((state,meta)=>({state,meta:{...meta,enabled}}));},
    prepareCloud(id){return atomic((state,meta)=>{const next=cloudPrepare(state,meta,id);return {state,meta:next,result:next.pending};});},
    acknowledgeCloud(result,requestId){return atomic((state,meta)=>({state,meta:cloudAcknowledge(state,meta,result,requestId)}));},
    adoptCloud(remote,expectedGeneration){return atomic((state,meta)=>{
      if(meta.generation!==expectedGeneration||meta.dirty||meta.pending)throw new Error('cloudLocalChanged');
      return {state:remote.payload,meta:{...meta,remoteVersion:remote.version,lastSynced:new Date().toISOString()}};
    },{recovery:true});},
    resolveCloud(remote,choice,expectedGeneration){return atomic((state,meta)=>{
      if(meta.generation!==expectedGeneration)throw new Error('cloudLocalChanged');
      return {state:choice==='remote'?remote.payload:state,
        meta:{...meta,pending:null,remoteVersion:remote.version,dirty:choice!=='remote',generation:meta.generation+1}};
    },{recovery:true});},
    onchange(callback){listeners.add(callback);return ()=>listeners.delete(callback);}
  };
}


function createMorrowCloudClient({config=MORROW_CLOUD_CONFIG,fetcher=fetch,storage=localStorage}={}) {
  const sessionKey='morrow-auth-'+new URL(config.url).hostname;
  const readSession=()=>{try{const s=JSON.parse(storage.getItem(sessionKey));return s?.access_token&&s?.refresh_token&&/^[a-f0-9-]{36}$/i.test(s.user?.id)?s:null;}catch{return null;}};
  let session=readSession(),refreshing;
  function saveSession(value){session=value;value?storage.setItem(sessionKey,JSON.stringify(value)):storage.removeItem(sessionKey);}
  async function request(path,{method='GET',body,token}={}) {
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
    try {
      const response=await fetcher(config.url+path,{method,headers:{apikey:config.publishableKey,...(body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined,signal:controller.signal});
      const data=await response.json().catch(()=>null);
      if(!response.ok){const error=new Error(response.status===401||response.status===403?'cloudAuthRequired':data?.code==='PGRST202'||response.status===404?'cloudSchemaRequired':response.status===429?'cloudRateLimit':'cloudRequestFailed');error.status=response.status;throw error;}
      return data;
    } catch(error){if(error.status)throw error;throw new Error('cloudNetworkError');}
    finally{clearTimeout(timer);}
  }
  async function token() {
    if(!session)throw new Error('cloudAuthRequired');
    if(session.expires_at*1000>Date.now()+60000)return session.access_token;
    if(!refreshing)refreshing=(async()=>{
      const refresh=async()=>{
        session=readSession();if(!session)throw new Error('cloudAuthRequired');
        if(session.expires_at*1000>Date.now()+60000)return session.access_token;
        const priorUser=session.user.id;
        const next=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token}});
        if(next.user?.id!==priorUser)throw new Error('cloudAuthRequired');
        saveSession(next);return next.access_token;
      };
      return globalThis.navigator?.locks?globalThis.navigator.locks.request(sessionKey,refresh):refresh();
    })().finally(()=>refreshing=null);
    return refreshing;
  }
  return {
    getSession:()=>session,
    // Separate sync revisions/outboxes even if user IDs match across projects.
    getDatabaseName:()=>session?'morrow-garden-user-'+new URL(config.url).hostname+'-'+session.user.id:'morrow-garden-v1',
    sessionKey,
    async signIn(email,password){const next=await request('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});if(!next?.user?.id)throw new Error('cloudAuthRequired');saveSession(next);return next;},
    async signUp(email,password){const result=await request('/auth/v1/signup',{method:'POST',body:{email,password}});if(result?.access_token)saveSession(result);return result;},
    async signOut(){if(session){try{await request('/auth/v1/logout',{method:'POST',token:await token()});}catch{/* Local sign-out remains available offline. */}}saveSession(null);},
    async rpc(name,body={}){return request('/rest/v1/rpc/'+name,{method:'POST',body,token:await token()});}
  };
}


function createErasSync({store,client,onStatus=()=>{},online=()=>navigator.onLine,id=()=>crypto.randomUUID()}) {
  let stopped=false,running=false,timer,retry=2000,conflict=null,activeEnabled=false;
  const report=(status,extra={})=>onStatus({status,conflict,enabled:activeEnabled,...extra});
  function schedule(delay=0){clearTimeout(timer);timer=null;if(!stopped)timer=setTimeout(()=>{timer=null;tick();},delay);}
  function remoteState(value){
    if(!value||!Number.isSafeInteger(value.version)||value.version<0)throw new Error('cloudInvalidResponse');
    return {...value,payload:validateGardenState(value.payload)};
  }
  async function tick(){
    if(stopped||running)return;
    running=true;
    try {
      const local=await store.readCloud();
      activeEnabled=local.meta.enabled;
      if(!local.meta.enabled){report('cloudDisabled');return;}
      if(!online()){report('cloudOffline');return;}
      if(conflict){report('cloudConflict');return;}
      report('cloudSyncing');
      // Persist the request before fetch; retry the same immutable payload/id.
      if(local.meta.pending||local.meta.dirty){
        const pending=await store.prepareCloud(id());
        if(stopped||!activeEnabled)return;
        const response=await client.rpc('morrow_eras_commit',{p_request_id:pending.id,p_expected_version:pending.expectedVersion,p_payload:pending.payload});
        if(stopped)return;
        if(response?.status==='conflict'){
          conflict=remoteState(response);report('cloudConflict');return;
        }
        if(response?.status!=='ok')throw new Error('cloudInvalidResponse');
        await store.acknowledgeCloud(response,pending.id);
        if(!activeEnabled){report('cloudDisabled');return;}
        report('cloudPending');retry=2000;schedule(0);return;
      }
      const remote=remoteState(await client.rpc('morrow_eras_read'));
      if(stopped||!activeEnabled)return;
      if(remote.version!==local.meta.remoteVersion){
        if(remote.version===0&&local.meta.remoteVersion>0)throw new Error('cloudRemoteReset');
        await store.adoptCloud(remote,local.meta.generation);
      }else if(!cloudStateEqual(remote.payload,local.state)&&remote.version>0){
        // A same-version mismatch requires review rather than silent replacement.
        conflict=remote;report('cloudConflict');return;
      }
      retry=2000;report('cloudSynced');
    } catch(error){report(error.message==='cloudLocalChanged'?'cloudPending':error.message);retry=Math.min(retry*2,60000);}
    finally{running=false;if(activeEnabled&&!timer&&!stopped)schedule(retry===2000?15000:retry);}
  }
  const unsubscribe=store.onchange(()=>{if(activeEnabled&&!conflict)report('cloudPending');schedule(150);});
  const resume=()=>schedule(0);
  globalThis.addEventListener?.('online',resume);
  globalThis.addEventListener?.('focus',resume);
  return {
    start:resume,
    async enable(){await store.setCloudEnabled(true);activeEnabled=true;resume();},
    async disable(){await store.setCloudEnabled(false);activeEnabled=false;clearTimeout(timer);timer=null;report('cloudDisabled');},
    async conflictCopies(){if(!conflict)throw new Error('cloudLocalChanged');const local=await store.readCloud();return {local:local.state,remote:conflict.payload,generation:local.meta.generation};},
    async resolve(choice,generation){if(!conflict)throw new Error('cloudLocalChanged');await store.resolveCloud(conflict,choice,generation);conflict=null;resume();},
    stop(){stopped=true;clearTimeout(timer);unsubscribe();globalThis.removeEventListener?.('online',resume);globalThis.removeEventListener?.('focus',resume);}
  };
}

function mountMorrowCloud({getLanguage}) {
  const client=createMorrowCloudClient(),session=client.getSession();
  // Login/logout reloads before changing namespaces. No guest/account auto-merge.
  const store=createGardenStore({name:client.getDatabaseName()});
  const t=key=>CLOUD_MESSAGES[getLanguage()][key]??CLOUD_MESSAGES[getLanguage()].cloudRequestFailed;
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const host=document.createElement('section');host.id='morrow-cloud';host.className='morrow-cloud panel';
  document.querySelector('.dashboard-grid').before(host);
  const modal=document.createElement('dialog');modal.className='garden-dialog';modal.id='cloud-auth-dialog';document.body.append(modal);
  let status=session?'cloudDisabled':'local',enabled=false,busy=false,sync,conflict=false,copies=null,notice=null,consentApproved=false,backupsConfirmed=false;
  const settings=document.createElement('a');settings.className='garden-button';settings.href='#morrow-cloud';
  document.querySelector('#settings-dialog .settings-info').before(settings);
  settings.onclick=()=>document.querySelector('#settings-dialog').close();
  function render(){
    settings.textContent=t('subtitle');
    host.innerHTML=`<div class="cloud-heading"><div><span class="garden-eyebrow">${t('subtitle')}</span><h2>${t('title')}</h2></div><p class="cloud-status" role="status">${esc(t(status))}</p></div><p class="cloud-help">${t('scope')}</p><p class="cloud-help">${t('guestNote')}</p>
      ${session?`<p class="cloud-help">${t('account')} · ${esc(session.user.email??'')}</p>${!enabled?`<label class="garden-checkbox"><input id="cloud-consent" type="checkbox" ${consentApproved?'checked':''}><span>${t('consent')}</span></label>`:''}<div class="cloud-actions"><button class="garden-button" data-cloud="${enabled?'pause':'enable'}">${t(enabled?'pause':'enable')}</button><button class="garden-button" data-cloud="retry" ${!enabled?'disabled':''}>${t('retry')}</button><button class="garden-button" data-cloud="logout">${t('logout')}</button></div>`:`<div class="cloud-actions"><button class="garden-button" data-cloud="login">${t('login')}</button><button class="garden-button" data-cloud="signup">${t('signup')}</button></div>`}
      ${conflict?`<div class="cloud-conflict"><p>${t('conflictHelp')}</p><button class="garden-button" data-cloud="copies">${t('copies')}</button><label class="garden-checkbox"><input type="checkbox" id="cloud-backups" ${backupsConfirmed?'checked':''} ${copies?'':'disabled'}><span>${t('backups')}</span></label><div class="cloud-actions"><button class="garden-button" data-cloud="local" ${copies?'':'disabled'}>${t('useLocal')}</button><button class="garden-button" data-cloud="remote" ${copies?'':'disabled'}>${t('useRemote')}</button></div></div>`:''}
      <p class="cloud-help">${t('privacy')}</p><a class="cloud-setup" href="https://github.com/sugARIboo-m/-my-first-project/blob/morrow/eras-delivery-20261018/morrow/SUPABASE_SETUP.md" target="_blank" rel="noopener">${t('setup')} ↗</a>${notice?`<p class="field-error" role="alert">${esc(t(notice))}</p>`:''}`;
  }
  host.onchange=event=>{if(event.target.id==='cloud-consent')consentApproved=event.target.checked;if(event.target.id==='cloud-backups')backupsConfirmed=event.target.checked;};
  function showAuth(kind){
    modal.innerHTML=`<form id="cloud-auth-form"><div class="dialog-title"><h2>${t(kind)}</h2><button type="button" data-cloud-close aria-label="${t('close')}">×</button></div><p class="dialog-help">${t('passwordHelp')}</p><div class="form-grid"><label class="full-width"><span>${t('email')}</span><input name="email" type="email" autocomplete="email" required maxlength="254"></label><label class="full-width"><span>${t('password')}</span><input name="password" type="password" autocomplete="${kind==='login'?'current-password':'new-password'}" required ${kind==='signup'?'minlength="8"':''} maxlength="256"></label></div><p class="field-error" id="cloud-auth-error" role="alert" hidden></p><button class="primary form-submit">${t('submit')}</button></form>`;
    modal.querySelector('[data-cloud-close]').onclick=()=>modal.close();
    modal.querySelector('form').onsubmit=async event=>{
      event.preventDefault();if(busy)return;const form=event.target,submit=form.querySelector('.form-submit');busy=true;submit.disabled=true;
      try{
        const fields=Object.fromEntries(new FormData(form));
        if(kind==='login')await client.signIn(fields.email.trim(),fields.password);
        else await client.signUp(fields.email.trim(),fields.password);
        form.reset();
        if(client.getSession()){sync?.stop();location.reload();}
        else{modal.close();notice='checkEmail';render();}
      }catch(error){const p=form.querySelector('#cloud-auth-error');p.textContent=t(error.message);p.hidden=false;}
      finally{busy=false;submit.disabled=false;}
    };modal.showModal();modal.querySelector('[name=email]').focus();
  }
  function download(name,state){const url=URL.createObjectURL(new Blob([JSON.stringify({format:'morrow-garden',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  host.onclick=async event=>{
    const control=event.target.closest('[data-cloud]');if(!control||control.disabled||busy)return;
    const action=control.dataset.cloud;notice=null;
    if(action==='login'||action==='signup'){showAuth(action);return;}
    if(action==='enable'&&!host.querySelector('#cloud-consent')?.checked){notice='consent';render();return;}
    if((action==='local'||action==='remote')&&(!copies||!host.querySelector('#cloud-backups')?.checked)){notice='backupFirst';render();return;}
    busy=true;control.disabled=true;
    try{
      if(action==='enable'){enabled=true;await sync.enable();}
      if(action==='pause'){enabled=false;await sync.disable();}
      if(action==='retry')sync.start();
      if(action==='logout'&&confirm(t('signoutHelp'))){sync?.stop();await client.signOut();location.reload();return;}
      if(action==='copies'){copies=await sync.conflictCopies();backupsConfirmed=false;download('Morrow-Conflict-Device.json',copies.local);download('Morrow-Conflict-Cloud.json',copies.remote);}
      if(action==='local'||action==='remote'){await sync.resolve(action,copies.generation);copies=null;conflict=false;}
    }catch(error){notice=error.message;if(error.message==='cloudLocalChanged')copies=null;}
    finally{busy=false;render();}
  };
  if(session){
    sync=createErasSync({store,client,onStatus:info=>{status=info.status;enabled=info.enabled;conflict=!!info.conflict;render();}});
    store.readCloud().then(local=>{enabled=local.meta.enabled;render();sync.start();}).catch(()=>{notice='cloudRequestFailed';render();});
  }
  // A different account in another tab must never use this tab's old namespace.
  window.addEventListener('storage',event=>{if(event.key===client.sessionKey){try{const next=JSON.parse(event.newValue);if(next?.user?.id!==session?.user?.id){sync?.stop();location.reload();}}catch{sync?.stop();location.reload();}}});
  window.addEventListener('morrow:language',()=>{if(modal.open)modal.close();render();});
  render();return {store};
}

function renderErasExperiences({host,state,store,getLanguage,onState,view,preferences}) {
  const locale=getLanguage()==='en'?'en-US':'zh-CN';
  const text=key=>EXPERIENCE_MESSAGES[getLanguage()][key]??key;
  const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=(amount,currency)=>amount===null?'—':new Intl.NumberFormat(locale,{style:'currency',currency,currencyDisplay:'narrowSymbol'}).format(amount/100);
  const instant=()=>new Date().toISOString();
  const oldNotice=document.getElementById('eras-extra-status');if(oldNotice&&!oldNotice.hidden&&oldNotice.dataset.experienceKey)oldNotice.textContent=text(oldNotice.dataset.experienceKey);
  const unlocked=new Map(state.achievements.map(item=>[item.code,item]));
  const conditions=achievementConditions(state,instant());
  const parent=document.createElement('section');parent.className='eras-experiences';host.append(parent);
  let modalHost=document.getElementById('eras-experience-dialogs');
  if(!modalHost){modalHost=document.createElement('div');modalHost.id='eras-experience-dialogs';document.body.append(modalHost);}
  function status(key){let element=document.getElementById('eras-extra-status');if(!element){element=document.createElement('div');element.id='eras-extra-status';element.className='toast';element.setAttribute('role','status');document.body.append(element);}element.dataset.experienceKey=key;element.textContent=text(key);element.hidden=false;clearTimeout(preferences.toast);preferences.toast=setTimeout(()=>element.hidden=true,6000);}
  function cardArtwork(themeId,locked=false){const theme=ERA_THEMES.find(item=>item.id===themeId)??ERA_THEMES[0];return `<div class="era-vinyl ${locked?'locked':''}" style="--record-one:${theme.palette[1]};--record-two:${theme.palette[0]}"><i></i><span>m.</span></div>`;}
  function downloadPng(svg,name){
    return new Promise((resolve,reject)=>{const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),image=new Image();image.onerror=()=>{URL.revokeObjectURL(url);reject();};image.onload=()=>{try{const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=900;canvas.getContext('2d').drawImage(image,0,0);canvas.toBlob(blob=>{URL.revokeObjectURL(url);if(!blob){reject();return;}const downloadURL=URL.createObjectURL(blob),link=document.createElement('a');link.href=downloadURL;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(downloadURL),1000);resolve();},'image/png');}catch(error){URL.revokeObjectURL(url);reject(error);}};image.src=url;});
  }
  function privateImage(themeId,title,subtitle,optional=''){
    return `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900"><rect width="1200" height="900" fill="#f4f0ed"/><text x="70" y="85" font-family="sans-serif" font-size="19" letter-spacing="5" fill="#68768c">MORROW ERAS</text><svg x="50" y="120" width="1100" height="580">${renderGardenSvg(themeId,4,{prefix:'experience-export',label:'Original Morrow artwork'})}</svg><text x="70" y="735" font-family="sans-serif" font-size="34" fill="#343a46">${escape(title)}</text><text x="70" y="787" font-family="sans-serif" font-size="21" fill="#68768c">${escape(subtitle)}</text><text x="70" y="837" font-family="sans-serif" font-size="23" fill="#68768c">${escape(optional)}</text></svg>`;
  }
  async function collectionExport(code){const earned=unlocked.get(code);if(!earned)return;await downloadPng(privateImage(earned.themeId,text('privacyTitle'),text('privacySubtitle')),'Morrow-Private-Keepsake.png');}
  function openDetail(code){
    const definition=ACHIEVEMENT_DEFINITIONS.find(item=>item.code===code),earned=unlocked.get(code),condition=conditions[code];
    modalHost.innerHTML=`<dialog id="era-achievement-dialog" class="garden-dialog"><div class="dialog-title"><h2>${escape(definition.name[getLanguage()])}</h2><button type="button" aria-label="${text('close')}">×</button></div>${cardArtwork(earned?.themeId??'eternal-bloom',!earned)}<p class="dialog-help">${escape(definition.description[getLanguage()])}</p><p class="dialog-help">${text('current')}: ${condition.currency?money(condition.current,condition.currency):condition.current} / ${condition.currency?money(condition.target,condition.currency):condition.target}</p>${earned?`<p class="dialog-help">${text('unlockDate')} · ${new Date(earned.unlockedAt).toLocaleDateString(locale)}</p><p class="dialog-help">${text('historical')}</p><p class="dialog-help">${text('observed')}</p><button class="garden-button" id="era-export-achievement">${text('export')}</button>`:condition.upstream?`<p class="dialog-help">${text('upstream')}</p>`:''}<p class="era-detail-code">${escape(definition.id)} · v${definition.version} · ${text(definition.rarity)}</p></dialog>`;
    modalHost.querySelector('.dialog-title button').onclick=()=>modalHost.querySelector('dialog').close();
    const exportButton=modalHost.querySelector('#era-export-achievement');if(exportButton)exportButton.onclick=()=>collectionExport(code).catch(()=>status('notAvailable'));
    modalHost.querySelector('dialog').showModal();
  }

  function renderCollection(){
    const filter=preferences.collectionTheme??'all',sort=preferences.collectionSort??'newest';
    const definitions=ACHIEVEMENT_DEFINITIONS.filter(definition=>filter==='all'||unlocked.get(definition.code)?.themeId===filter)
      .sort((a,b)=>{const first=unlocked.get(a.code)?.unlockedAt,second=unlocked.get(b.code)?.unlockedAt;if(!first&&!second)return a.id.localeCompare(b.id);if(!first)return 1;if(!second)return -1;return sort==='newest'?second.localeCompare(first):first.localeCompare(second);});
    parent.innerHTML=`<div class="garden-section-title"><div><span class="garden-eyebrow">ERA COLLECTION</span><h3>${text('collection')}</h3><p>${text('collectionSub')}</p></div><span class="collection-count">${state.achievements.length} / ${ACHIEVEMENT_DEFINITIONS.length}</span></div><p class="garden-boundary">${text('source')}</p><div class="collection-filters"><select id="collection-theme" aria-label="Era"><option value="all">${text('all')}</option>${ERA_THEMES.map(theme=>`<option value="${theme.id}">${theme.name}</option>`).join('')}</select><select id="collection-sort" aria-label="${text('newest')}"><option value="newest">${text('newest')}</option><option value="oldest">${text('oldest')}</option></select></div><div class="collection-grid">${definitions.map(definition=>{const earned=unlocked.get(definition.code);return `<button class="achievement-card ${earned?'is-unlocked':'is-locked'}" data-achievement="${definition.code}">${cardArtwork(earned?.themeId??'eternal-bloom',!earned)}<span class="achievement-group">${text(definition.group)}</span><h4>${escape(definition.name[getLanguage()])}</h4><p>${escape(definition.description[getLanguage()])}</p><span class="achievement-state">${text(earned?'unlocked':'locked')}${earned?' · '+new Date(earned.unlockedAt).toLocaleDateString(locale):''}</span></button>`;}).join('')}</div><details class="garden-contact-sheet"><summary>${text('settings')}</summary><p>${text('settingsSub')}</p><form id="era-threshold-form" class="era-threshold-form"><label>${text('currency')}<select name="currency">${['CNY','USD','EUR','GBP'].map(currency=>`<option>${currency}</option>`).join('')}</select></label>${state.settings.milestoneThresholds.map((amount,index)=>`<label>${text('threshold')} ${index+1}<input name="threshold${index}" inputmode="decimal" maxlength="24" value="${(amount/100).toFixed(2)}"></label>`).join('')}<button class="garden-button">${text('save')}</button><p class="field-error" id="era-threshold-error" role="alert" hidden></p></form></details>`;
    parent.querySelector('#collection-theme').value=filter;parent.querySelector('#collection-sort').value=sort;
    parent.querySelector('#collection-theme').onchange=event=>{preferences.collectionTheme=event.target.value;renderCollection();};
    parent.querySelector('#collection-sort').onchange=event=>{preferences.collectionSort=event.target.value;renderCollection();};
    parent.querySelectorAll('[data-achievement]').forEach(button=>button.onclick=()=>openDetail(button.dataset.achievement));
    const form=parent.querySelector('#era-threshold-form');form.elements.currency.value=state.settings.milestoneCurrency;
    form.onsubmit=async event=>{event.preventDefault();try{const fields=Object.fromEntries(new FormData(form)),thresholds=[0,1,2].map(index=>parseAmount(fields['threshold'+index]));if(thresholds.some((amount,index)=>index>0&&amount<=thresholds[index-1]))throw Error();const changed=await store.update(current=>({...current,settings:{...current.settings,milestoneCurrency:fields.currency,milestoneThresholds:thresholds}}));onState(changed);status('saved');}catch{parent.querySelector('#era-threshold-error').textContent=text('invalid');parent.querySelector('#era-threshold-error').hidden=false;}};
  }

  function renderWrapped(){
    const currentYear=new Date().getFullYear(),source=actualLedger(state);
    const years=[...new Set([currentYear,...source.transactions.map(record=>Number(record.date.slice(0,4))),...state.goals.filter(goal=>goal.bloomedAt).map(goal=>new Date(goal.bloomedAt).getFullYear())])].sort((a,b)=>b-a);
    const year=preferences.wrappedYear??currentYear,currency=preferences.wrappedCurrency??'CNY',slide=Math.max(0,Math.min(3,preferences.wrappedSlide??0));
    let summary;try{summary=annualGardenSummary(state,year,currency,instant());}catch{parent.innerHTML=`<p class="garden-error">${text('notAvailable')}</p>`;return;}
    const theme=ERA_THEMES[slide];
    const slides=[
      `<span class="wrapped-kicker">${year} · ${text('moneyEra')}</span><h3>${text('wrappedSub')}</h3><dl><div><dt>${text('income')}</dt><dd>${money(summary.income,currency)}</dd></div><div><dt>${text('spending')}</dt><dd>${money(summary.spending,currency)}</dd></div></dl>`,
      `<span class="wrapped-kicker">${text('savingEra')}</span><h3>${getLanguage()==='en'?'You made room for tomorrow.':'给明天，留一点余地。'}</h3><dl><div><dt>${text('net')}</dt><dd>${money(summary.netCashFlow,currency)}</dd></div><div><dt>${text('rate')}</dt><dd>${summary.savingsRate===null?'—':summary.savingsRate.toFixed(1)+'%'}</dd></div></dl><p>${text('rateHelp')}</p><p>${text('allocation')}: ${money(summary.recordedAllocations,currency)} · ${text('allocationHelp')}</p>`,
      `<span class="wrapped-kicker">${text('soundtrack')}</span><h3>${text('categories')}</h3><p>${text('frequent')}: ${escape(summary.frequentCategory??text('notAvailable'))}</p><ul class="wrapped-categories">${summary.topCategories.map(category=>`<li><span>${escape(category.name)}</span><b>${money(category.amount,currency)}</b></li>`).join('')||`<li>${text('noCategories')}</li>`}</ul>`,
      `<span class="wrapped-kicker">${text('characterMoment')}</span><h3>${text('milestone')}</h3><dl><div><dt>${text('goals')}</dt><dd>${summary.goalsCompleted}</dd></div><div><dt>${text('days')}</dt><dd>${summary.hasLedger?summary.activeDays:'—'}</dd></div></dl><p>${summary.favoriteMilestone?text('stage')+' · '+new Date(summary.favoriteMilestone.at).toLocaleDateString(locale):text('noMilestone')}</p><p>${text('consistencyHelp')}</p>`
    ];
    const latest=state.wrappedSnapshots.filter(item=>item.year===year&&item.summary.currency===currency).at(-1);
    parent.innerHTML=`<div class="garden-section-title"><div><span class="garden-eyebrow">MONEY WRAPPED</span><h3>${text('wrapped')}</h3><p>${text('wrappedSub')}</p></div><div class="wrapped-selectors"><select id="wrapped-year" aria-label="${text('year')}">${years.map(value=>`<option>${value}</option>`).join('')}</select><select id="wrapped-currency" aria-label="${text('currency')}">${['CNY','USD','EUR','GBP'].map(value=>`<option>${value}</option>`).join('')}</select></div></div><p class="garden-boundary">${text(summary.hasLedger?'sourceLedger':'sourceGoals')}</p>${summary.hasAnyData?`<article class="wrapped-card" style="--wrapped-light:${theme.palette[0]};--wrapped-accent:${theme.palette[1]};--wrapped-ink:${theme.palette[2]}">${slides[slide]}<span class="wrapped-page">0${slide+1} / 04</span></article><div class="wrapped-controls"><button class="garden-button" id="wrapped-prev" ${slide===0?'disabled':''}>${text('previous')}</button><div class="wrapped-dots">${[0,1,2,3].map(index=>`<button data-wrapped-slide="${index}" aria-label="${index+1}" aria-pressed="${index===slide}"></button>`).join('')}</div><button class="garden-button" id="wrapped-next" ${slide===3?'disabled':''}>${text('next')}</button></div><div class="garden-data-actions"><button class="garden-button" id="save-wrapped">${text('generate')}</button><button class="garden-button" id="export-wrapped">${text('exportCard')}</button></div><label class="garden-checkbox"><input id="wrapped-export-money" type="checkbox" ${preferences.exportMoney?'checked':''}><span>${text('exportAmounts')}</span></label><p class="garden-boundary">${text('exportPrivacy')}</p>${latest?`<p class="garden-boundary">${text('snapshot')}: ${new Date(latest.generatedAt).toLocaleString(locale)}</p>`:''}`:`<div class="garden-empty"><h3>${text('noData')}</h3><p>${text('noDataSub')}</p></div>`}<section class="monthly-review-box"><h3>${text('monthly')}</h3><p>${text('monthlySub')}</p><label>${text('reviewPeriod')} <input id="era-review-month" type="month" value="${preferences.reviewMonth??year+'-01'}"></label><div id="monthly-review-details"></div></section>`;
    parent.querySelector('#wrapped-year').value=year;parent.querySelector('#wrapped-currency').value=currency;
    parent.querySelector('#wrapped-year').onchange=event=>{preferences.wrappedYear=Number(event.target.value);renderWrapped();};
    parent.querySelector('#wrapped-currency').onchange=event=>{preferences.wrappedCurrency=event.target.value;renderWrapped();};
    function go(index){preferences.wrappedSlide=index;renderWrapped();}
    if(summary.hasAnyData){
      parent.querySelector('#wrapped-prev').onclick=()=>go(slide-1);parent.querySelector('#wrapped-next').onclick=()=>go(slide+1);
      parent.querySelectorAll('[data-wrapped-slide]').forEach(button=>button.onclick=()=>go(Number(button.dataset.wrappedSlide)));
      parent.querySelector('#wrapped-export-money').onchange=event=>preferences.exportMoney=event.target.checked;
      parent.querySelector('#save-wrapped').onclick=async event=>{
        event.target.disabled=true;
        try{const currentSummary=annualGardenSummary(await store.read(),year,currency,instant());if(!currentSummary.hasAnyData)return;const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(currentSummary)));const id='wrapped-'+Array.from(new Uint8Array(digest),n=>n.toString(16).padStart(2,'0')).join('');
          const changed=await store.update(current=>{
            if(JSON.stringify(annualGardenSummary(current,year,currency,instant()))!==JSON.stringify(currentSummary))throw new Error('gardenConflict');
            return current.wrappedSnapshots.some(item=>item.id===id)?current:{...current,wrappedSnapshots:[...current.wrappedSnapshots,{id,year,summary:currentSummary,generatedAt:instant()}]};
          });onState(changed);status('generated');
        }catch{status('notAvailable');event.target.disabled=false;}
      };
      parent.querySelector('#export-wrapped').onclick=()=>{
        const financial=preferences.exportMoney?text('income')+': '+money(summary.income,currency)+' · '+text('spending')+': '+money(summary.spending,currency):'';
        downloadPng(privateImage(theme.id,year+' · '+text('wrapped'),text('wrappedSub'),financial),'Morrow-Private-Wrapped-'+year+'.png').catch(()=>status('notAvailable'));
      };
    }
    function reviewMonth(){
      const month=parent.querySelector('#era-review-month').value;preferences.reviewMonth=month;
      const details=parent.querySelector('#monthly-review-details');
      let actual;try{actual=monthlyActualSummary(state,month,instant());}catch{details.innerHTML=`<p>${text('notAvailable')}</p>`;return;}
      if(!actual.recordCount){details.innerHTML=`<p>${text('noMonth')}</p>`;return;}
      const {income,spending}=actual;
      const reviewed=state.reviews.some(review=>review.kind==='monthly'&&review.period===month);
      details.innerHTML=`<p>${text('monthIncome')}: ${money(income,'CNY')} · ${text('monthSpending')}: ${money(spending,'CNY')}</p><button class="garden-button" id="review-actual-month" ${reviewed?'disabled':''}>${text(reviewed?'reviewed':'review')}</button>`;
      const button=details.querySelector('button');button.onclick=async()=>{button.disabled=true;try{const changed=await store.update(current=>current.reviews.some(review=>review.kind==='monthly'&&review.period===month)?current:{...current,reviews:[...current.reviews,{kind:'monthly',period:month,at:instant()}]});onState(changed);status('reviewed');}catch{status('notAvailable');button.disabled=false;}};
    }
    parent.querySelector('#era-review-month').onchange=reviewMonth;reviewMonth();
  }
  if(view==='collection')renderCollection();else renderWrapped();
}


function mountEras({getLanguage,store=createGardenStore()}) {
  const query=selector=>document.querySelector(selector);
  const translate=key=>ERA_MESSAGES[getLanguage()][key]??key;
  const escape=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const format=(amount,currency='CNY')=>new Intl.NumberFormat(getLanguage()==='en'?'en-US':'zh-CN',{style:'currency',currency,currencyDisplay:'narrowSymbol',minimumFractionDigits:2,maximumFractionDigits:2}).format(amount/100);
  const identifier=()=>crypto.randomUUID();
  const now=()=>new Date().toISOString();
  let state=emptyGardenState(),ready=false,storageError=null,selectedTheme='eternal-bloom',sampleStage=2;
  let editingGoal=null,pendingImport=null,backupAcknowledged=false,busy=false,noticeTimer;
  let activeView='garden';const extraPreferences={};
  const container=document.createElement('section');container.id='eras-section';container.className='eras-section';
  query('main footer').before(container);
  const dashboard=document.createElement('section');dashboard.className='garden-dashboard panel';dashboard.id='garden-dashboard';
  query('.dashboard-grid').before(dashboard);
  const nav=document.createElement('a');nav.href='#eras-section';nav.className='eras-nav';nav.innerHTML='<svg aria-hidden="true"><use href="#leaf"/></svg><span>Eras</span>';
  query('.navigation').append(nav);
  const mobile=query('.tabbar a[href="#goals-section"]');mobile.href='#eras-section';mobile.classList.add('eras-nav');mobile.querySelector('span').removeAttribute('data-i');mobile.querySelector('span').textContent='Eras';
  const motionSetting=document.createElement('label');motionSetting.className='setting-row';motionSetting.id='garden-motion-setting';
  query('#settings-dialog .settings-info').before(motionSetting);
  const dialogs=document.createElement('div');dialogs.id='garden-dialogs';document.body.append(dialogs);
  const status=document.createElement('div');status.className='toast garden-toast';status.setAttribute('role','status');status.hidden=true;document.body.append(status);

  function announce(key){status.dataset.eraKey=key;status.textContent=translate(key);status.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>status.hidden=true,6500);}
  function dateText(value){return new Intl.DateTimeFormat(getLanguage()==='en'?'en-US':'zh-CN',{dateStyle:'medium',timeZone:'UTC'}).format(new Date(value.length===10?value+'T12:00:00Z':value));}
  function button(action,label,extra=''){return `<button class="garden-button" data-garden-action="${action}" ${extra}>${translate(label)}</button>`;}
  function themeOptions(value){return ERA_THEMES.map(theme=>`<option value="${theme.id}" ${theme.id===value?'selected':''}>${theme.name}</option>`).join('');}
  function goalOptions(value){return state.goals.filter(goal=>goal.fundingMode==='manual'&&!goal.paused).map(goal=>`<option value="${escape(goal.id)}" ${goal.id===value?'selected':''}>${escape(goal.name)} · ${goal.currency}</option>`).join('');}
  function goalCard(goal,index){
    const progress=goalProgress(goal.currentSaved,goal.targetAmount),theme=ERA_THEMES.find(item=>item.id===goal.themeId);
    return `<article class="saved-garden" data-goal-id="${escape(goal.id)}" style="--era-accent:${theme.palette[1]}">
      <div class="garden-art-wrap">${renderGardenSvg(theme.id,progress.stage,{prefix:'saved-'+goal.id,label:theme.name+' — '+translate(GARDEN_STAGES[progress.stage])})}<span class="garden-stage-tag">${translate(GARDEN_STAGES[progress.stage])}</span>${goal.paused?`<span class="garden-pause-tag">${translate('paused')}</span>`:''}</div>
      <div class="saved-garden-body"><div class="saved-garden-heading"><div><span class="garden-theme-name">${theme.name}</span><h3>${escape(goal.name)}</h3></div><button class="garden-edit" data-garden-action="edit" data-id="${escape(goal.id)}" aria-label="${translate('edit')}"><svg aria-hidden="true"><use href="#edit"/></svg></button></div>
      <div class="garden-amounts"><strong>${format(goal.currentSaved,goal.currency)}</strong><span>/ ${format(goal.targetAmount,goal.currency)}</span></div>
      <div class="garden-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress.percent}" aria-label="${escape(goal.name)}"><span style="width:${progress.percent}%"></span></div>
      <div class="garden-progress-label"><span>${progress.percent.toLocaleString(getLanguage()==='en'?'en-US':'zh-CN',{maximumFractionDigits:2})}%</span><span>${progress.complete?translate('fullyFunded'):translate('remaining')+' '+format(goal.targetAmount-goal.currentSaved,goal.currency)}</span></div>
      <p class="garden-date" title="${translate('plannedDate')}">${goal.targetDate?translate('due')+' · '+dateText(goal.targetDate):translate('noDate')}</p><p class="garden-forecast">${translate('noForecast')}</p>
      ${goal.fundingMode==='legacy-total'?`<p class="garden-legacy">${translate('legacyMode')}</p>`:''}
      ${goal.bloomedAt?`<div class="garden-memory"><span>${translate('firstBloom')} · ${dateText(goal.bloomedAt)}</span>${button('memory','memory',`data-id="${escape(goal.id)}"`)}</div><p class="garden-memory-note">${translate('historicBloom')}</p>`:''}</div></article>`;
  }

  function render(){
    if(!status.hidden&&status.dataset.eraKey)status.textContent=translate(status.dataset.eraKey);
    const current=state.goals.find(goal=>!goal.paused)??state.goals[0];
    dashboard.innerHTML=current?`<a class="dashboard-garden-link" href="#eras-section"><div class="dashboard-garden-art">${renderGardenSvg(current.themeId,goalProgress(current.currentSaved,current.targetAmount).stage,{prefix:'dashboard',label:translate('currentEra')})}</div><div><span class="garden-eyebrow">${translate('currentEra')}</span><h2>${escape(current.name)}</h2><p>${ERA_THEMES.find(theme=>theme.id===current.themeId).name} · ${goalProgress(current.currentSaved,current.targetAmount).percent}%</p></div><span class="dashboard-garden-arrow">↗</span></a>`:
      `<div class="dashboard-garden-empty"><div><span class="garden-eyebrow">MORROW ERAS</span><h2>${translate('noGoals')}</h2><p>${translate('allLocal')}</p></div>${button('new','newGoal',!ready?'disabled':'')}</div>`;
    container.innerHTML=`<div class="eras-heading"><div><div class="garden-eyebrow">${translate('eyebrow')}</div><h2>${translate('title')}</h2><p>${translate('subtitle')}</p></div><div class="garden-local-status"><i></i>${translate(ready?'local':'loading')}</div></div>
      <nav class="eras-tabs" aria-label="Eras">${['garden','collection','wrapped'].map(view=>`<button type="button" data-era-view="${view}" aria-pressed="${view===activeView}" class="${view===activeView?'selected':''}">${translate(view)}</button>`).join('')}</nav>
      <p class="garden-boundary">${translate('localHelp')}</p>
      ${storageError?`<div class="garden-error" role="alert">${translate(storageError)} ${button('retry','retry')}</div>`:''}
      <div class="garden-section-title" id="garden-live"><div><h3>${translate('myGardens')}</h3><p>${translate('allocationNote')}</p></div><div class="garden-actions">${button('new','newGoal',!ready?'disabled':'')}${button('transfer','transfer',!ready||state.goals.filter(goal=>goal.fundingMode==='manual'&&!goal.paused).length<2?'disabled':'')}</div></div>
      <div class="saved-gardens">${state.goals.length?state.goals.map(goalCard).join(''):`<div class="garden-empty"><span class="garden-seed-mark">◦</span><h3>${translate('noGoals')}</h3><p>${translate('emptyHelp')}</p>${button('new','newGoal',!ready?'disabled':'')}</div>`}</div>
      <div class="garden-data-actions">${button('backup','backup',!ready?'disabled':'')}${button('pick-restore','restore',!ready?'disabled':'')}${button('pick-legacy','importLegacy',!ready?'disabled':'')}<span>${translate('pendingCloud')}</span></div>
      <section class="garden-studio"><div class="garden-section-title"><div><span class="garden-eyebrow">ERA ATELIER</span><h3>${translate('explore')}</h3><p>${translate('exploreHelp')}</p></div><span class="garden-sample-pill">${translate('sample')}</span></div>
      <div class="era-theme-picker" role="group" aria-label="${translate('theme')}">${ERA_THEMES.map(theme=>`<button class="era-theme-option ${selectedTheme===theme.id?'selected':''}" data-garden-action="sample-theme" data-theme="${theme.id}" aria-pressed="${selectedTheme===theme.id}"><span class="era-theme-swatch" style="background:linear-gradient(135deg,${theme.palette[0]},${theme.palette[1]})"></span><span>${theme.name}</span></button>`).join('')}</div>
      <div class="garden-studio-scene"><div class="garden-studio-art">${renderGardenSvg(selectedTheme,sampleStage,{prefix:'studio',label:ERA_THEMES.find(theme=>theme.id===selectedTheme).name+' — '+translate(GARDEN_STAGES[sampleStage])})}</div><div class="garden-studio-copy"><span class="garden-eyebrow">${translate('sample')}</span><h3>${ERA_THEMES.find(theme=>theme.id===selectedTheme).name}</h3><p>${translate(ERA_THEMES.find(theme=>theme.id===selectedTheme).descriptionKey)}</p><div class="garden-stage-number">0${sampleStage+1}<span>/ 05</span></div><b>${translate(GARDEN_STAGES[sampleStage])}</b></div></div>
      <div class="garden-stage-picker" role="group" aria-label="${translate('showcase')}">${GARDEN_STAGES.map((stage,index)=>`<button data-garden-action="sample-stage" data-stage="${index}" class="${sampleStage===index?'selected':''}" aria-pressed="${sampleStage===index}"><span>0${index+1}</span><b>${translate(stage)}</b><small>${['0–24%','25–49%','50–74%','75–99%','100%'][index]}</small></button>`).join('')}</div></section>
      <details class="garden-contact-sheet" open><summary>${translate('showcase')}</summary><p>${translate('showcaseHelp')}</p><div class="garden-matrix">${ERA_THEMES.map(theme=>`<div class="garden-matrix-row"><h4>${theme.name}</h4><div class="garden-matrix-stages">${GARDEN_STAGES.map((stage,index)=>`<figure>${renderGardenSvg(theme.id,index,{prefix:'matrix-'+theme.id+'-'+index,label:theme.name+' — '+translate(stage)})}<figcaption>${translate(stage)} <span>${['0–24%','25–49%','50–74%','75–99%','100%'][index]}</span></figcaption></figure>`).join('')}</div></div>`).join('')}</div></details>
      <input type="file" id="garden-legacy-file" accept=".json,application/json" hidden><input type="file" id="garden-restore-file" accept=".json,application/json" hidden>`;

    document.documentElement.dataset.gardenMotion=state.settings.motion;

  }

  function queryAllDialogTranslations(){
    dialogs.querySelectorAll('[data-era-i]').forEach(element=>element.textContent=translate(element.dataset.eraI));
  }
  function openGoal(id=null){

  async function loadImport(file,kind){
    if(!file)return;
    try{
      if(file.size>(kind==='legacy'?2000000:8000000))throw new Error(kind==='legacy'?'gardenInvalidLegacy':'gardenInvalidBackup');
      const raw=await file.text();let preview,digest;
      if(kind==='legacy'){
        preview=legacyGardenPreview(raw);const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));digest=Array.from(new Uint8Array(bytes),byte=>byte.toString(16).padStart(2,'0')).join('');

    }catch(error){announce(error.message);}
  }

  function actions(event){

// The overview includes fictional earlier entries in addition to the recent rows.

const base = {};
for (const [month, income, expense] of [
  ['2026-04',1400000,870000], ['2026-05',1500000,820000],
  ['2026-06',1650000,690000], ['2026-07',1500000,950000],
  ['2026-08',1750000,780000], ['2026-09',1650000,712000],
  ['2026-10',1800000,628450]
]) {
  const amounts = month === '2026-10' ? [320000,125000,100000,40000,43450]
    : [42,24,16,10].map(percent => Math.floor(expense * percent / 100));
  if (amounts.length === 4) amounts.push(expense - amounts.reduce((sum,n) => sum+n,0));
  base[month] = {income,expense,categories:Object.fromEntries(categories.slice(0,5).map((key,i)=>[key,amounts[i]]))};
}
for (const record of transactions) {
  const snapshot = base[record.date.slice(0,7)];
  snapshot[record.type] -= record.amount;
  if(record.type === 'expense') snapshot.categories[record.category] -= record.amount;

    .format(new Date(date + 'T12:00:00Z'));

    form.elements.type.value=record.type; form.elements.amount.value=(record.amount/100).toFixed(2);
    form.elements.name.value=nameOf(record); form.elements.category.value=record.category;
    form.elements.date.value=record.date; form.elements.account.value=record.account; form.elements.note.value=record.note;
  } else {
    const now=new Date();const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    form.elements.date.value=today.startsWith(selectedMonth)?today:selectedMonth+'-01';
  }
  render(); $('#entry-dialog').showModal(); form.elements.amount.focus();
}
function renderDeletePreview() {
  const record=transactions.find(record=>record.id===deletingId);
  $('#delete-preview').textContent=record?nameOf(record)+' · '+dateLabel(record.date)+' · '+money(record.amount):'';
}
function requestDelete(id) {
  deletingId=id;renderDeletePreview();$('#delete-dialog').showModal();
  $('#delete-dialog [data-close]').focus();
}
function toast(key) {
  $('#toast').textContent=t(key);$('#toast').hidden=false;clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('#toast').hidden=true,5000);
}

$('#entry-form').onsubmit = event => {
  event.preventDefault(); clearError(); const fields=Object.fromEntries(new FormData(event.target));
  let amount;
  try {amount=parseAmount(fields.amount);} catch {setError('invalidAmount','amount');return;}
  if(!fields.name.trim()) {setError('invalidName','name');return;}
  if(fields.name.trim().length>60) {setError('nameTooLong','name');return;}
  if(!isCalendarDate(fields.date)) {setError('invalidDate','date');return;}
  if(!accountKeys.includes(fields.account)) {setError('invalidAccount','account');return;}
  if(!categories.includes(fields.category)) {setError('invalidCategory','category');return;}
  if(!['income','expense'].includes(fields.type)) {setError('invalidType','type');return;}
  if(fields.note.length>160) {setError('noteTooLong','note');return;}
  const prior=transactions.find(record=>record.id===editingId);
  const next={id:editingId??'preview-'+(++sequence),customName:fields.name.trim(),category:fields.category,
    account:fields.account,amount,type:fields.type,date:fields.date,icon:prior?.icon??'wallet',note:fields.note.trim()};
  // Keep translated sample names translated unless the user actually renames one.
  if(prior?.label && fields.name.trim()===nameOf(prior)) {delete next.customName;next.label=prior.label;}
  let updated;
  try {
    updated=upsertRecord(transactions,next);
    for(const month of new Set([next.date.slice(0,7),prior?.date.slice(0,7)].filter(Boolean))) summarize(base,updated,month);
  } catch(error) {setError(error.message,'amount');return;}
  const edited=Boolean(editingId);transactions=updated;selectedMonth=next.date.slice(0,7);
  $('#transaction-filter').value='all';$('#category-filter').value='all';$('#search').value='';
  $('#entry-dialog').close();render();toast(edited?'updated':'saved');
};

// Add delete as an explicit secondary action in the edit form, with a safe confirmation.
const deleteButton=document.createElement('button');deleteButton.type='button';deleteButton.className='delete-from-form';
deleteButton.dataset.i='deleteTransaction';$('#entry-form').append(deleteButton);
deleteButton.onclick=()=>{if(editingId){$('#entry-dialog').close();requestDelete(editingId);}};
$('#entry-dialog').addEventListener('close',()=>clearError());
$('#delete-dialog').addEventListener('close',()=>{
  // Cancelling deletion returns to the same draft, including unsaved edits.
  if(deletingId){deletingId=null;$('#entry-dialog').showModal();}
});
function showEntry(id=null){openEntry(id);deleteButton.hidden=!id;}
$('#confirm-delete').onclick=()=>{
  if(!deletingId)return;
  transactions=transactions.filter(record=>record.id!==deletingId);deletingId=null;
  $('#delete-dialog').close();render();toast('removed');$('#search').focus({preventScroll:true});
};
$('#transaction-rows').onclick=event=>{const button=event.target.closest('[data-edit]');if(button)showEntry(button.dataset.edit);};
$('#language').onclick=()=>{language=language==='en'?'zh':'en';render();};
$('#language-setting').onchange=event=>{language=event.target.value;render();};
$('#appearance').onchange=event=>{appearance=event.target.value;applyTheme();};
$('#theme').onclick=()=>$('#settings-dialog').showModal();
document.querySelectorAll('[data-dialog]').forEach(button=>button.onclick=()=>$('#'+button.dataset.dialog+'-dialog').showModal());
document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>button.closest('dialog').close());

$('#month').onchange=event=>{selectedMonth=event.target.value;render();};
$('#transaction-filter').onchange=renderLedger;$('#category-filter').onchange=renderLedger;$('#search').oninput=renderLedger;
$('#clear-filters').onclick=()=>{$('#transaction-filter').value='all';$('#category-filter').value='all';$('#search').value='';renderLedger();$('#search').focus();};
document.addEventListener('keydown',event=>{
  const typing=event.target.closest('input,textarea,select');
  if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){
    if(document.querySelector('dialog[open]'))return;event.preventDefault();showEntry();
  } else if(event.key==='/'&&!typing&&!document.querySelector('dialog[open]')){
    event.preventDefault();$('#search').scrollIntoView({block:'center'});$('#search').focus();
  }
});
function activeSection(id) {
  document.querySelectorAll('.navigation a,.tabbar a').forEach(link=>{
    const active=link.getAttribute('href')==='#'+id;link.classList.toggle('active',active);
    if(active)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');
  });
}
document.querySelectorAll('.navigation a,.tabbar a,.brand').forEach(link=>link.addEventListener('click',()=>activeSection(link.hash.slice(1))));
let scrollFrame;
window.addEventListener('scroll',()=>{
  if(scrollFrame)return;scrollFrame=requestAnimationFrame(()=>{
    scrollFrame=null;let current='dashboard-section';
    for(const id of ['transactions-section','goals-section','eras-section']) if($('#'+id).getBoundingClientRect().top<window.innerHeight*.45)current=id;
    activeSection(current);
  });
},{passive:true});

activeSection('dashboard-section');render();
